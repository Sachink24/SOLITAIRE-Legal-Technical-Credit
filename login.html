<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOLITAIRE — Sign In</title>
<style>
:root{--bg:#0A0D12;--panel:#12161D;--panel2:#171C25;--gold:#C4A672;--gold2:#E1C892;--ink:#ECE8E0;--dim:#9BA3AE;--bad:#C1594E;--ok:#5FA97A}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid rgba(196,166,114,.25);border-radius:16px;padding:30px;box-shadow:0 15px 45px #0008}
.brand{text-align:center;margin-bottom:28px}.brand h1{font-family:Georgia,serif;margin:0;font-size:32px;letter-spacing:.06em}.brand p{color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
label{display:block;color:var(--dim);font-size:12px;margin:0 0 7px}input{width:100%;padding:12px 13px;margin-bottom:16px;border-radius:9px;border:1px solid #ffffff18;background:var(--panel2);color:var(--ink);font-size:15px;outline:0}input:focus{border-color:var(--gold)}
button{width:100%;padding:13px;border:0;border-radius:9px;background:linear-gradient(#E1C892,#C4A672);font-weight:700;cursor:pointer;color:#14100A}
button:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;padding:11px 12px;border-radius:8px;margin-bottom:16px;font-size:13px;line-height:1.5}.msg.show{display:block}.err{background:#c1594e20;color:#e28b81;border:1px solid #c1594e55}.ok{background:#5fa97a20;color:#8bd0a3;border:1px solid #5fa97a55}.info{background:#c4a67220;color:#e1c892;border:1px solid #c4a67255}
.small{margin-top:16px;text-align:center;color:#6b7280;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>SOLITAIRE</h1>
    <p>Legal · Technical · Credit</p>
  </div>
  <div id="msg" class="msg"></div>
  <form id="loginForm">
    <label for="email">User ID / Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Sign In</button>
  </form>
  <div class="small">Use the same Supabase Auth account as Associate App.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  const sb = window.SolitaireDB && window.SolitaireDB.sb;
  const routes = {
    admin:'admin.html', owner:'admin.html',
    legal:'legal.html',
    technical:'technical.html', tech:'technical.html',
    credit:'credit.html'
  };
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  function show(text,type='info'){
    msg.textContent=text;
    msg.className='msg show '+type;
  }

  async function routeForSession(session){
    if(!session || !session.user) return false;

    const {data:profile,error} = await sb
      .from('users')
      .select('id,auth_user_id,name,email,role,status')
      .eq('auth_user_id',session.user.id)
      .maybeSingle();

    if(error){
      console.error('Profile lookup:',error);
      show('Login succeeded, but the user profile could not be read: '+error.message,'err');
      return false;
    }

    if(!profile || profile.status !== 'active' || !routes[profile.role]){
      await sb.auth.signOut();
      show('Your account is not active or has no SOLITAIRE role.','err');
      return false;
    }

    // Final browser-side verification. This is the identity used by RLS.
    const {data:{user}} = await sb.auth.getUser();
    console.log('SOLITAIRE AUTH USER:', user ? user.id : null);
    console.log('SOLITAIRE ROLE:', profile.role);

    if(!user){
      show('Authentication session was not available. Please sign in again.','err');
      return false;
    }

    window.location.href = routes[profile.role];
    return true;
  }

  async function init(){
    if(!sb){
      show('Supabase client failed to load. Check supabase-config.js.','err');
      return;
    }
    const {data,error} = await sb.auth.getSession();
    if(error){ console.error(error); return; }
    if(data && data.session) await routeForSession(data.session);
  }

  document.getElementById('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    if(!email||!password)return;

    btn.disabled=true;
    btn.textContent='Signing in…';
    show('Authenticating…','info');

    try{
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){
        console.error('signInWithPassword:',error);
        show(error.message || 'Invalid User ID or password.','err');
        return;
      }

      // Force-refresh the session so the browser client has the JWT
      // before any protected page/database request is made.
      const {data:sessionData,error:sessionError}=await sb.auth.getSession();
      if(sessionError || !sessionData.session){
        console.error('Session error:',sessionError);
        await sb.auth.signOut();
        show('Login succeeded but no Supabase session was established.','err');
        return;
      }

      console.log('AUTH UID AFTER LOGIN:',sessionData.session.user.id);
      show('Signed in. Opening your workspace…','ok');
      await routeForSession(sessionData.session);
    }catch(err){
      console.error(err);
      show('Unable to sign in. Check the browser console for details.','err');
    }finally{
      btn.disabled=false;
      btn.textContent='Sign In';
    }
  });

  sb.auth.onAuthStateChange((event,session)=>{
    console.log('AUTH EVENT:',event,'USER:',session && session.user ? session.user.id : null);
  });

  init();
})();
</script>
</body>
</html>
